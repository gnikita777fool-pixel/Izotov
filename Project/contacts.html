
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — DevSpace 2.0</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html">Dev<span>Space</span></a>
    <nav class="nav">
      <a href="index.html">Главная</a>
      <a href="about.html">О проекте</a>
      <a href="courses.html">Обучение</a>
      <a href="projects.html">Проекты</a>
      <a class="active" href="contacts.html">Контакты</a>
    </nav>
  </header>
  <main class="page">
    <p class="eyebrow">БУДЕМ НА СВЯЗИ</p>
    <h1>Есть идея? <span>Давай обсудим.</span></h1>
    <section class="card">
      <h2>Напиши сообщение</h2>
      <p>Демонстрационная форма для учебного проекта.</p>
      <form id="contact-form">
        <label for="name">Имя</label>
        <input id="name" name="name" placeholder="Как тебя зовут?" required>
        <label for="email">Электронная почта</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>
        <label for="message">Сообщение</label>
        <textarea id="message" name="message" rows="5" placeholder="Расскажи о своей идее..." required></textarea>
        <button class="button" type="submit">Отправить ↗</button>
        <p id="form-status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer>© 2026 DevSpace</footer>
</body>
</html>
